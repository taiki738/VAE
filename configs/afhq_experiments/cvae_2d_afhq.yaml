model_params:
  name: "ConditionalVAE2D"
  in_channels: 3
  num_classes: 2
  latent_dim: 3
  img_size: 128

data_params:
  data_path: "Data/"
  train_batch_size: 64
  val_batch_size: 64
  num_workers: 4
  img_size: 128

exp_params:
  LR: 0.005
  weight_decay: 0.0
  scheduler_gamma: 0.95
  kld_weight: 0.00025
  manual_seed: 1265

trainer_params:
  gpus: [0]
  max_epochs: 50

logging_params:
  save_dir: "logs/"
  name: "ConditionalVAE2D_AFHQ"
